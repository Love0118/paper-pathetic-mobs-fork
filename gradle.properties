group=io.papermc.paper
mcVersion=26.2
# Upstream Paper build this fork is based on. Local artifacts retain the build marker
# while remaining distinguishable from official Paper builds via the "local" suffix.
paperBaseBuildNumber=121
# This is the current API version for use in (paper-)plugin.yml files
# During snapshot cycles this should be the anticipated version of the release target
apiVersion=26.2
channel=STABLE

# Set to true while updating Minecraft version
updatingMinecraft=false

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
