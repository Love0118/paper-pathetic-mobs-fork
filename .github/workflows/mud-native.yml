name: MUD Rust JNI
on:
  push:
    branches: [26.3-mud]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: cargo fmt --check --manifest-path native/mud-entities/Cargo.toml
      - run: cargo clippy --locked --manifest-path native/mud-entities/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path native/mud-entities/Cargo.toml
      - run: |
          mkdir -p native/mud-entities/target/java-test
          javac -d native/mud-entities/target/java-test native/mud-entities/tests/java/io/papermc/paper/optimization/mud/MudNativeEntities.java
          java -Xcheck:jni --enable-native-access=ALL-UNNAMED -cp native/mud-entities/target/java-test io.papermc.paper.optimization.mud.MudNativeEntities "$PWD/native/mud-entities/target/release/libmud_entities.so"
      - uses: actions/upload-artifact@v4
        with:
          name: mud-entities-linux
          path: native/mud-entities/target/release/libmud_entities.so
